name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - shell: bash
        run: python tests/check_wheel.py dist/*.whl
      - if: runner.os == 'Linux'
        run: npx --prefix frontend playwright install --with-deps chrome
      - if: runner.os == 'Linux'
        run: python tests/run_browser_checks.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: output/playwright/
