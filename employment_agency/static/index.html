<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Employment Agency</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">YOUR PRIVATE CAREER WORKSPACE</span>
        <h1>Employment Agency</h1>
        <p>Turn your experience into considered applications.</p>
      </div>
      <span class="badge">Local · you submit</span>
    </header>
    <nav aria-label="Workspace sections">
      <button data-tab="career">Career</button
      ><button data-tab="search">Search</button
      ><button data-tab="applications">Applications</button
      ><button data-tab="settings">Settings & recovery</button>
    </nav>
    <p id="notice" role="status" aria-live="polite"></p>
    <main id="content"></main>
    <footer>
      Career evidence stays local unless you grant provider consent. Review
      every document before applying.
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
