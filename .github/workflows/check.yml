name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: node --test tests/check-public-demo.test.mjs tests/stage-public-demo.test.mjs tests/promote-public-demo.test.mjs
      - run: npm --prefix frontend run build
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: python tests/check_hosted_install.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - if: runner.os != 'Linux'
        shell: bash
        run: python tests/check_wheel.py dist/*.whl
      - if: runner.os == 'Linux'
        run: npx --prefix frontend playwright install --with-deps chrome
      - if: runner.os == 'Linux'
        shell: bash
        run: python tests/check_wheel.py --browser dist/*.whl
      - if: runner.os == 'Linux'
        run: python tests/check_development.py
      - if: runner.os == 'Linux'
        run: python tests/run_browser_checks.py
      - if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Prepare the approved public résumé
        run: node scripts/showcase-resume.mjs --materialize
        env:
          PUBLIC_DEMO_RESUME_1: ${{ secrets.PUBLIC_DEMO_RESUME_1 }}
          PUBLIC_DEMO_RESUME_2: ${{ secrets.PUBLIC_DEMO_RESUME_2 }}
          PUBLIC_DEMO_RESUME_3: ${{ secrets.PUBLIC_DEMO_RESUME_3 }}
          PUBLIC_DEMO_RESUME_4: ${{ secrets.PUBLIC_DEMO_RESUME_4 }}
      - if: runner.os == 'Linux'
        run: npm --prefix frontend run build:preview
      - if: runner.os == 'Linux'
        run: python tests/run_public_preview_checks.py
      - if: runner.os == 'Linux'
        run: python -m pip install '.[apply]'
      - if: runner.os == 'Linux'
        run: python tests/run_apply_checks.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: public-demo-${{ github.sha }}
          path: output/public-preview/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: output/playwright/
  deploy-public-demo:
    name: Deploy public demo
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: public-demo-production
      cancel-in-progress: false
      queue: max
    environment:
      name: public-demo
      url: https://employment-agency-demo.vercel.app/discover/
    env:
      VERCEL_ORG_ID: team_QmjRFzULoHfOTipsjFByfxON
      VERCEL_PROJECT_ID: prj_jW5ss3iNVEOEBwi0fxJL7ymAFeG0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: public-demo-${{ github.sha }}
          path: ${{ runner.temp }}/public-demo
      - name: Skip a superseded revision
        id: candidate
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; this release is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage the tested fictional site
        id: stage
        if: steps.candidate.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEMO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Missing VERCEL_DEMO_TOKEN. See docs/public-demo-deployment.md." >&2
            exit 1
          fi
          node scripts/stage-public-demo.mjs "$RUNNER_TEMP/public-demo" "$GITHUB_SHA" > "$RUNNER_TEMP/public-demo-url"
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const url = readFileSync(process.env.RUNNER_TEMP + "/public-demo-url", "utf8").trim();
            if (!/^https:\/\/[a-z0-9-]+\.vercel\.app$/.test(url)) throw new Error("Unexpected staged deployment URL");
            appendFileSync(process.env.GITHUB_OUTPUT, "url=" + url + "\n");
          '
      - name: Verify the staged release
        if: steps.stage.outputs.url != ''
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: node scripts/check-public-demo.mjs "$STAGED_URL" "$GITHUB_SHA"
      - name: Promote only the current main revision
        id: promote
        if: steps.stage.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEMO_TOKEN }}
          STAGED_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer main revision exists; the staged deployment is not promoted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          if ! node scripts/promote-public-demo.mjs "$STAGED_URL" "$GITHUB_SHA"; then
            echo "Promotion API did not confirm completion; the required alias check will determine the result." >&2
          fi
      - name: Verify the public alias
        if: always() && steps.promote.outputs.attempted == 'true'
        run: |
          node scripts/check-public-demo.mjs https://employment-agency-demo.vercel.app "$GITHUB_SHA" --wait-for-alias
          echo "Public demo verified for $GITHUB_SHA: https://employment-agency-demo.vercel.app/discover/" >> "$GITHUB_STEP_SUMMARY"
