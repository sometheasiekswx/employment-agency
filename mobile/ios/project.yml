name: EmploymentAgency
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  EmploymentAgency:
    type: application
    platform: iOS
    sources:
      - Sources
    configFiles:
      Debug: Config/Workspace.xcconfig
      Release: Config/Workspace.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.employmentagency.mobile
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  EmploymentAgencyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: EmploymentAgency
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.employmentagency.mobile.uitests
        SWIFT_VERSION: "5.0"
schemes:
  EmploymentAgency:
    build:
      targets:
        EmploymentAgency: all
    test:
      targets:
        - EmploymentAgencyUITests
