[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "employment-agency-local"
version = "0.7.0"
description = "Local-first, evidence-grounded job application workspace"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pypdf>=6.10,<7", "python-docx>=1.2,<2", "reportlab>=4.4.9,<5",
    "Flask>=3.1.2,<4", "tzdata>=2025.2", "lxml>=5.3,<7", "Protego>=0.4,<1",
    "truststore>=0.10,<1", "Pillow>=12.2,<14",
]
[project.optional-dependencies]
discovery = ["playwright>=1.56,<2"]
apply = ["playwright>=1.56,<2", "keyring>=25,<27", "google-auth-oauthlib>=1.2,<2"]
[project.scripts]
employment-agency = "employment_agency.cli:main"
[tool.uv]
# Vercel installs Python dependencies before running the frontend build.
# Serve app.py from the checkout; complete wheels still use pip/setuptools.
package = false
[tool.setuptools.packages.find]
include = ["employment_agency*"]
[tool.setuptools.package-data]
employment_agency = ["web/**/*", "web/*", "demo_data/*"]
